[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=27
    -D SPI_FREQUENCY=60000000
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TOUCH_CS=33
    -D POWER_BATTERY_SENSE_ENABLED=0
    -D POWER_LIGHT_SLEEP_ENABLED=0
    -D POWER_LIGHT_SENSOR_ENABLED=0
    -D POWER_TEMP_PROTECT_ENABLED=1
    -D SERIAL_DEBUG_ENABLED=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Itest/mocks
    -O1
build_src_filter = -<src/*>
