[platformio]
default_envs = esp32dev_always_on

[env:esp32dev_battery]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

build_flags =
    -Isrc
    -include board_config.h
    -O3
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=80000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D POWER_LIGHT_SLEEP_ENABLED=0
    -D POWER_TEMP_PROTECT_ENABLED=1
    -D POWER_ACTIVE_FRAME_INTERVAL_MS=16
    -D POWER_RELAX_FRAME_INTERVAL_MS=22
    -D POWER_IDLE_FRAME_INTERVAL_MS=33
build_unflags =
    -Os

[env:esp32dev_always_on]
extends = env:esp32dev_battery
build_flags =
    ${env:esp32dev_battery.build_flags}
    -D POWER_PROFILE_ALWAYS_ON=1

[env:esp32dev_expression_test]
extends = env:esp32dev_always_on
build_flags =
    ${env:esp32dev_always_on.build_flags}
    -D SERIAL_DEBUG_ENABLED=1
    -D PERF_TARGET_60FPS=1
    -D PERF_CONTINUOUS_ANIMATION=1
    -D POWER_ACTIVE_CPU_MHZ=240

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Itest/mocks
    -O1
build_src_filter = -<src/*>
