[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

build_flags =
    -Isrc
    -include board_config.h
    -O3
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=80000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D POWER_LIGHT_SLEEP_ENABLED=0
    -D POWER_TEMP_PROTECT_ENABLED=1
build_unflags =
    -Os

[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D SERIAL_DEBUG_ENABLED=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Itest/mocks
    -O1
build_src_filter = -<src/*>

; Only upload AFTER a verified 1:1 resistor divider connects BAT to GPIO35.
; This environment is not the default and is not used for the stock board.
[env:esp32dev_battery_divider]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D POWER_BATTERY_SENSE_ENABLED=1
    -D POWER_BATTERY_DIVIDER=2.0f
